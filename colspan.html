
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Lịch họp công ty</title>
</head>
<body>
    <h1>Lịch họp công ty</h1>

    <table border="1">
        <tr>
            <th>Ngày</th>
            <th>Giờ</th>
            <th>Nội dung cuộc họp</th>
        </tr>

        <tr>
            <td rowspan="2">Thứ Hai</td>
            <td>08:00 - 09:00</td>
            <td>Họp phòng kinh doanh</td>
        </tr>
        <tr>
            <td>09:30 - 10:30</td>
            <td>Họp phòng kỹ thuật</td>
        </tr>

        <tr>
            <td rowspan="2">Thứ Ba</td>
            <td>08:00 - 10:00</td>
            <td>Họp ban giám đốc</td>
        </tr>
        <tr>
            <td colspan="2">
                10:00 - 12:00: Họp tổng kết dự án
                (kéo dài 2 giờ)
            </td>
        </tr>

        <tr>
            <td>Thứ Tư</td>
            <td>14:00 - 15:00</td>
            <td>Họp nhân sự</td>
        </tr>
    </table>
</body>
</html>
